[versions]
kotlin = "2.4.20"
composeMultiplatform = "1.12.0"
material3 = "1.9.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
serialization = "1.11.0"
# Same ADB client and version as the Android companion.
dadb = "2.0.0"
jmdns = "3.6.3"
jna = "5.19.1"
junit = "4.13.2"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }

lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Dispatchers.Main on desktop is the Swing event queue.
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Pure Kotlin ADB client: no adb.exe or ADB server to install.
dadb = { module = "dev.mobile:dadb", version.ref = "dadb" }

# Discovers TVs that advertise themselves on the network (_adb._tcp, _googlecast._tcp).
jmdns = { module = "org.jmdns:jmdns", version.ref = "jmdns" }

# DPAPI: the ADB key is stored encrypted by Windows, readable only by the current user account.
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
