org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Displayed, installed and compared by the update check.
# CI overrides it with the tag: windows-v1.2.3 -> -PappVersion=1.2.3.
# MSI format: three numbers, the first under 256.
appVersion=1.6.0

# Public repository that releases, and therefore updates, come from.
githubRepository=jolabs40/TVSlim

# SPDX identifier shown in About. Must match the LICENSE file.
appLicense=Apache-2.0

# Ed25519 public key (X.509, base64) that verifies each installer before running it.
# The private key is kept out of the repository; CI reads it from the TVSLIM_CLE_SIGNATURE secret.
# A fork that publishes its own builds must generate its own pair: tools/GenerateSigningKey.java.
# Changing it makes installed versions refuse every later update.
updatesPublicKey=MCowBQYDK2VwAyEAZYK+P6QNDhiYJeMIyJtpFskt5pxIeKigd0EbxZ0tovs=
