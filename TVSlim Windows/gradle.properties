org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Version affichée, installée et comparée par la vérification des mises à jour.
# La CI la remplace par celle du tag : windows-v1.2.3 → -PversionApp=1.2.3.
# Format imposé par MSI : trois nombres, le premier inférieur à 256.
versionApp=1.1.0

# Dépôt public d'où viennent les versions publiées, et donc les mises à jour.
depotGithub=jolabs40/TVSlim

# Licence affichée dans « À propos », identifiant SPDX. Doit correspondre au fichier LICENSE.
licenceApp=Apache-2.0

# Clé publique Ed25519 (X.509, base64) qui vérifie chaque installateur avant de l'exécuter.
# La clé privée ne vit que dans le coffre et dans les secrets GitHub (TVSLIM_CLE_SIGNATURE).
# Une version publiée ailleurs (fork) doit générer sa propre paire : outils/GenererCleSignature.java.
# Ne jamais la changer à la légère : les versions déjà installées refuseraient les suivantes.
clePubliqueMisesAJour=MCowBQYDK2VwAyEAZYK+P6QNDhiYJeMIyJtpFskt5pxIeKigd0EbxZ0tovs=
