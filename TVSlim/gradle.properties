org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.builtInKotlin=false
android.newDsl=false
android.usesSdkInManifest.disallowed=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false

# Release signing. The keystore is git-ignored; KEYSTORE_PASSWORD and KEY_PASSWORD come from the
# environment, never from a file.
KEYSTORE_FILE=../tvslim-release.keystore
KEY_ALIAS=tvslim

# Version of both apps (TV Slim Remote and the TV app) for untagged builds; CI replaces it with the
# android-vX.Y.Z tag.
appVersion=1.1.0

# SHA-256 fingerprint of the (public) signing certificate: CI refuses to publish an APK signed with another key.
# A lost or changed key cuts every install off from updates, since Android refuses an APK signed differently
# from the installed one.
certificateFingerprint=4296bda0518f1a591d66914e6bab7b2f0d0030be6d6c798ef3aed5d279cf96f8
