org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.builtInKotlin=false
android.newDsl=false
android.usesSdkInManifest.disallowed=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false

# Signature release. Le keystore est exclu par .gitignore, et les mots de passe
# ne vivent que dans le coffre (_tools/secret.py) — jamais dans un fichier :
#   python ../_tools/secret.py exec KEYSTORE_PASSWORD=tvslim/keystore KEY_PASSWORD=tvslim/keystore -- "C:/Program Files/Git/bin/bash.exe" -c "./gradlew assembleRelease"
KEYSTORE_FILE=../tvslim-release.keystore
KEY_ALIAS=tvslim

# Version des deux applications (TV Slim Remote et l'application TV), hors tag : la CI la remplace par celle
# du tag android-vX.Y.Z.
versionApp=1.0.0

# Empreinte SHA-256 du certificat de signature (public) : la CI refuse de publier un APK signé d'une autre clé.
# Une clé perdue ou changée prive toutes les installations de leurs mises à jour : Android refuse un APK signé
# autrement que celui en place.
empreinteCertificat=4296bda0518f1a591d66914e6bab7b2f0d0030be6d6c798ef3aed5d279cf96f8
