# Builds, tests and publishes TV Slim for Android: TV Slim Remote (phone) and the TV app.
#
#  - Pull request or push to main touching the Android project: tests, then both release APKs
#    (R8-minified, unsigned), kept as an artifact.
#  - Annotated tag android-vX.Y.Z: the same, then both APKs are signed with the release key, the
#    certificate is checked against the fingerprint in gradle.properties, and the release is published
#    with the tag message as release notes.
#
# The keystore (secrets TVSLIM_ANDROID_KEYSTORE, base64, and TVSLIM_ANDROID_KEYSTORE_PASSWORD) is only
# read by the publish job, and only on a tag. Actions are pinned by commit SHA because tags can move.
#
# An Android release is never marked Latest (--latest=false): the README and its badge send
# /releases/latest to Windows, and "Download for Windows" would otherwise lead to APKs.

name: TV Slim Android

on:
  push:
    tags: ['android-v*']
    branches: [main]
    paths:
      - 'TVSlim/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'TVSlim/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  construire:
    name: Tests et APK de release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TVSlim
    outputs:
      version: ${{ steps.version.outputs.valeur }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Version
        id: version
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/android-v* ]]; then
            version="${REF#refs/tags/android-v}"
          else
            version=$(sed -n 's/^versionApp=//p' gradle.properties)
          fi
          # versionCode is X*10000 + Y*100 + Z, so Y and Z must stay under 100.
          if [[ ! "$version" =~ ^[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Version invalide : $version"
            exit 1
          fi
          echo "valeur=$version" >> "$GITHUB_OUTPUT"

      - name: Tests (noyau, téléphone, téléviseur)
        run: ./gradlew :core:test :app-mobile:testDebugUnitTest :app-tv:testDebugUnitTest "-PversionApp=${{ steps.version.outputs.valeur }}"

      - name: APK de release, minifiés
        run: ./gradlew :app-mobile:assembleRelease :app-tv:assembleRelease "-PversionApp=${{ steps.version.outputs.valeur }}"

      # Without a keystore AGP outputs -release-unsigned.apk files; the publish job signs them.
      - name: Rassembler les APK
        env:
          VERSION: ${{ steps.version.outputs.valeur }}
        run: |
          mkdir -p publication
          for module in app-mobile:Remote app-tv:TV; do
            apks=("${module%%:*}"/build/outputs/apk/release/*.apk)
            if [ "${#apks[@]}" -ne 1 ]; then
              echo "::error::${module%%:*} : un seul APK de release attendu, trouvé ${#apks[@]}"
              exit 1
            fi
            cp "${apks[0]}" "publication/TVSlim-${module#*:}-$VERSION.apk"
          done
          ls -l publication

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tvslim-android-non-signe
          path: TVSlim/publication/
          if-no-files-found: error

  publier:
    name: Signature et publication
    needs: construire
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tvslim-android-non-signe
          path: publication

      # Same schemes as the Gradle signingConfig: no v1 (minSdk 26), v2, and v3 for the certificate
      # lineage. AGP already aligned the APKs, native libraries at 16 KB included; zipalign only checks
      # it, since apksigner moves nothing. No v4: apksigner would write a .apk.idsig next to the APK,
      # `publication/*` would publish it, and it only serves incremental `adb install` over USB.
      - name: Signer les APK
        env:
          KEYSTORE_B64: ${{ secrets.TVSLIM_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.TVSLIM_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          outils=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools : $outils"
          magasin="$RUNNER_TEMP/tvslim-release.keystore"
          printf %s "$KEYSTORE_B64" | base64 -d > "$magasin"
          for apk in publication/*.apk; do
            "$outils/zipalign" -c -P 16 4 "$apk"
            "$outils/apksigner" sign --ks "$magasin" --ks-key-alias tvslim \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --v4-signing-enabled false "$apk"
          done
          rm -f "$magasin"

      # An APK signed with another key would be refused as an update by every device that already has
      # TV Slim, so check the certificate the way Android does before publishing.
      - name: Vérifier le certificat contre l'empreinte attendue
        run: |
          outils=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          attendue=$(sed -n 's/^empreinteCertificat=//p' TVSlim/gradle.properties)
          for apk in publication/*.apk; do
            "$outils/apksigner" verify --print-certs "$apk" > certificat.txt
            if ! grep -qF "certificate SHA-256 digest: $attendue" certificat.txt; then
              echo "::error::$apk n'est pas signé par la clé attendue"
              cat certificat.txt
              exit 1
            fi
          done
          (cd publication && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # actions/checkout fetches the tag by its commit SHA, so it arrives lightweight, without its
      # message. Read the notes from the tag object through the API instead.
      - name: Notes de version, depuis le message du tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          objet=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "${objet%% *}" != "tag" ]; then
            echo "::error::$TAG doit être un tag annoté : son message sert de notes de version."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/tags/${objet#* }" --jq .message > notes.md

      - name: Publier sur GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.construire.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" publication/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "TV Slim for Android $VERSION" \
            --notes-file notes.md \
            --latest=false \
            --verify-tag
